<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1b2922"/>
      <stop offset="55%" stop-color="#101a15"/>
      <stop offset="100%" stop-color="#070b0a"/>
    </radialGradient>
    <radialGradient id="plate" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#26332b"/>
      <stop offset="70%" stop-color="#151f19"/>
      <stop offset="100%" stop-color="#0b120e"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a321f"/>
      <stop offset="100%" stop-color="#2c1b10"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="560" rx="310" ry="112" fill="url(#plate)"/>
  <ellipse cx="400" cy="560" rx="310" ry="112" fill="none" stroke="#3a4d40" stroke-opacity=".55" stroke-width="2"/>
  <ellipse cx="445" cy="580" rx="185" ry="36" fill="#000" opacity=".5" filter="url(#soft)"/>

  <!-- tiramisu cube -->
  <g stroke-linejoin="round">
    <!-- left face -->
    <polygon points="280,400 340,455 340,492 280,437" fill="#f2e6cf"/>
    <polygon points="280,437 340,492 340,532 280,477" fill="#7b573a"/>
    <polygon points="280,477 340,532 340,565 280,510" fill="#eddcbd"/>
    <polygon points="280,400 340,455 340,565 280,510" fill="none" stroke="#241609" stroke-width="2.5"/>
    <!-- right face -->
    <polygon points="340,455 605,412 605,447 340,490" fill="#f2e6cf"/>
    <polygon points="340,490 605,447 605,487 340,530" fill="#7b573a"/>
    <polygon points="340,530 605,487 605,522 340,565" fill="#eddcbd"/>
    <polygon points="340,455 605,412 605,522 340,565" fill="none" stroke="#241609" stroke-width="2.5"/>
    <!-- layer separators -->
    <line x1="340" y1="490" x2="605" y2="447" stroke="#c9b189" stroke-width="1.5" opacity=".7"/>
    <line x1="340" y1="530" x2="605" y2="487" stroke="#c9b189" stroke-width="1.5" opacity=".7"/>
    <line x1="280" y1="437" x2="340" y2="492" stroke="#c9b189" stroke-width="1.5" opacity=".7"/>
    <line x1="280" y1="477" x2="340" y2="532" stroke="#c9b189" stroke-width="1.5" opacity=".7"/>
    <!-- cocoa top -->
    <polygon points="280,400 545,358 605,412 340,455" fill="url(#top)" stroke="#1f130a" stroke-width="2.5"/>
  </g>

  <!-- cocoa dusting -->
  <g fill="#6b4a33" opacity=".85">
    <circle cx="380" cy="420" r="3"/><circle cx="430" cy="404" r="2.4"/><circle cx="480" cy="398" r="3.2"/>
    <circle cx="520" cy="406" r="2.2"/><circle cx="405" cy="438" r="2.6"/><circle cx="355" cy="412" r="2"/>
    <circle cx="462" cy="426" r="2.8"/><circle cx="545" cy="418" r="2.4"/><circle cx="500" cy="386" r="2"/>
    <circle cx="428" cy="382" r="1.8"/>
  </g>
  <g fill="#8a6a4d" opacity=".6">
    <circle cx="392" cy="428" r="1.6"/><circle cx="448" cy="412" r="1.4"/><circle cx="512" cy="392" r="1.5"/>
  </g>

  <!-- coffee beans -->
  <g transform="translate(243 592) rotate(28)">
    <ellipse rx="17" ry="25" fill="#4a3322" stroke="#23150b" stroke-width="2.5"/>
    <path d="M 0 -22 q -9 22 0 44" fill="none" stroke="#23150b" stroke-width="3"/>
  </g>
  <g transform="translate(610 590) rotate(-24)">
    <ellipse rx="15" ry="22" fill="#3d2a1c" stroke="#23150b" stroke-width="2.5"/>
    <path d="M 0 -19 q -8 19 0 38" fill="none" stroke="#23150b" stroke-width="3"/>
  </g>

  <!-- plate cocoa sprinkles -->
  <circle cx="300" cy="620" r="3" fill="#4a3322"/>
  <circle cx="540" cy="626" r="2.4" fill="#4a3322"/>
  <circle cx="640" cy="612" r="2" fill="#4a3322"/>
</svg>
