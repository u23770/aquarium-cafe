<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1b2922"/>
      <stop offset="55%" stop-color="#101a15"/>
      <stop offset="100%" stop-color="#070b0a"/>
    </radialGradient>
    <radialGradient id="plate" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#26332b"/>
      <stop offset="70%" stop-color="#151f19"/>
      <stop offset="100%" stop-color="#0b120e"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6cd8f"/>
      <stop offset="45%" stop-color="#dda055"/>
      <stop offset="100%" stop-color="#a8642a"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2c27e"/>
      <stop offset="55%" stop-color="#cf8c41"/>
      <stop offset="100%" stop-color="#96551f"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <ellipse cx="400" cy="560" rx="310" ry="112" fill="url(#plate)"/>
  <ellipse cx="400" cy="560" rx="310" ry="112" fill="none" stroke="#3a4d40" stroke-opacity=".55" stroke-width="2"/>
  <ellipse cx="400" cy="578" rx="235" ry="66" fill="#000" opacity=".5" filter="url(#soft)"/>

  <!-- croissant body: layered segments along a crescent -->
  <g stroke="#8f5522" stroke-width="3" stroke-linejoin="round">
    <ellipse cx="222" cy="545" rx="30" ry="17" transform="rotate(-65 222 545)" fill="url(#gold2)"/>
    <ellipse cx="578" cy="545" rx="30" ry="17" transform="rotate(65 578 545)" fill="url(#gold2)"/>
    <ellipse cx="252" cy="512" rx="47" ry="33" transform="rotate(-52 252 512)" fill="url(#gold2)"/>
    <ellipse cx="548" cy="512" rx="47" ry="33" transform="rotate(52 548 512)" fill="url(#gold2)"/>
    <ellipse cx="292" cy="478" rx="63" ry="49" transform="rotate(-34 292 478)" fill="url(#gold2)"/>
    <ellipse cx="508" cy="478" rx="63" ry="49" transform="rotate(34 508 478)" fill="url(#gold2)"/>
    <ellipse cx="343" cy="452" rx="78" ry="60" transform="rotate(-16 343 452)" fill="url(#gold2)"/>
    <ellipse cx="457" cy="452" rx="78" ry="60" transform="rotate(16 457 452)" fill="url(#gold2)"/>
    <ellipse cx="400" cy="443" rx="92" ry="68" fill="url(#gold)"/>
  </g>

  <!-- flake highlights -->
  <g fill="none" stroke="#ffe3ae" stroke-opacity=".85" stroke-width="6" stroke-linecap="round">
    <path d="M 352 406 q 48 -26 96 0"/>
    <path d="M 299 430 q 38 -22 74 -8"/>
    <path d="M 427 422 q 36 -14 74 8"/>
    <path d="M 262 470 q 28 -16 52 -6"/>
    <path d="M 486 464 q 24 -10 52 6"/>
  </g>
  <g fill="none" stroke="#b06a30" stroke-opacity=".8" stroke-width="4" stroke-linecap="round">
    <path d="M 368 500 q 32 14 64 0"/>
    <path d="M 296 516 q 26 10 46 -2"/>
    <path d="M 458 514 q 20 12 46 2"/>
  </g>

  <!-- crumbs -->
  <ellipse cx="228" cy="606" rx="7" ry="3.5" fill="#d99a4e"/>
  <ellipse cx="586" cy="600" rx="6" ry="3" fill="#d99a4e"/>
  <ellipse cx="524" cy="632" rx="5" ry="2.5" fill="#b97c36"/>
  <ellipse cx="278" cy="626" rx="4" ry="2" fill="#b97c36"/>
</svg>
