<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Waiter · Delivery Dispatch · Aquarium Cafe &amp; Resturant</title>
  <meta name="description" content="Aquarium waiter dashboard — live delivery dispatch: received, kitchen, ready, drivers on the road." />
  <meta name="theme-color" content="#09384c" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="../customer/images/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/waiter.css" />
</head>
<body>

  <!-- ══════════ SVG ICON SPRITE ══════════ -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-fish" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12.2C6.5 6.7 13 5.2 19 8l3-2c-.3 3.1-.3 6.1 0 9.2l-3-2c-6 2.8-12.5 1.3-17-1z"/><circle cx="6.6" cy="11.4" r=".9" fill="currentColor" stroke="none"/><path d="M11 9.4c1.6 1 2.5 2.4 2.7 4.2" opacity=".7"/></g></symbol>
    <symbol id="i-scooter" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17a2.5 2.5 0 1 0 5 0 2.5 2.5 0 0 0-5 0zm11 0a2.5 2.5 0 1 0 5 0 2.5 2.5 0 0 0-5 0z"/><path d="M7.5 17h6l2-8h3.5l1.5 5"/><path d="M13 5h2.5v4"/><path d="M4 7h5l-1.5 5"/></g></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></g></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></g></symbol>
    <symbol id="i-cash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5h.01M18 14.5h.01" stroke-width="2.4"/></g></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></g></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></g></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></g></symbol>
    <symbol id="i-checkc" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.2"/><path d="m8.5 12.2 2.4 2.4 4.6-5"/></g></symbol>
    <symbol id="i-checks" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g></symbol>
    <symbol id="i-ban" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.2"/><path d="M5.6 5.6l12.8 12.8"/></g></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.2"/><path d="M12 7v5l3.4 2"/></g></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></g></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.35"/><path d="M21 3v6h-6"/></g></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.7 5.3a9 9 0 0 1 0 13.4"/></g></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></g></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></g></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></g></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></g></symbol>
  </svg>

  <!-- ══════════ TOP BAR ══════════ -->
  <header class="topbar">
    <div class="brand">
      <span class="brand__mark"><svg class="icon"><use href="#i-fish"/></svg></span>
      <span class="brand__text">AQUARIUM<small data-i18n="app.tag">WAITER</small></span>
    </div>

    <div class="topbar__clock" aria-label="Current time" data-i18n-aria="top.clock">
      <strong id="clockTime">--:--:--</strong>
      <span id="clockDate">—</span>
    </div>

    <div class="topbar__actions">
      <span class="live" id="livePill"><i></i><span id="liveText">Live</span></span>
      <button class="lang-btn" id="langBtn" aria-label="التبديل إلى العربية" data-i18n-aria="top.lang" title="Language">
        <svg class="icon"><use href="#i-globe"/></svg><span id="langBtnLabel">ع</span>
      </button>
      <button class="icon-btn" id="soundBtn" aria-label="Toggle notification sound" data-i18n-aria="top.sound">
        <svg class="icon icon-sound"><use href="#i-sound"/></svg>
        <svg class="icon icon-mute" hidden><use href="#i-mute"/></svg>
      </button>
      <button class="icon-btn" id="refreshBtn" aria-label="Refresh orders" data-i18n-aria="top.refresh">
        <svg class="icon"><use href="#i-refresh"/></svg>
      </button> <button type="button" class="btn" id="notifyBtn" title="Notifications" data-i18n-title="top.notifications">🔔</button>
    </div>
  </header>

  <!-- ══════════ DELIVERY DISPATCH BOARD ══════════ -->
  <main class="delv container" id="deliveryView" aria-live="polite">
    <div class="delv__meta" id="delvMeta">—</div>
    <div class="delv__board" id="delvBoard">

      <section class="dcol" data-dstatus="Received">
        <header class="dcol__head ds-Received">
          <svg class="icon"><use href="#i-bell"/></svg><h2 data-i18n="col.Received">Received</h2>
          <span class="dcol__count" id="delcount-Received">0</span>
        </header>
        <div class="dcol__list" id="dellist-Received"></div>
      </section>

      <section class="dcol" data-dstatus="Accepted">
        <header class="dcol__head ds-Accepted">
          <svg class="icon"><use href="#i-check"/></svg><h2 data-i18n="col.Accepted">Accepted</h2>
          <span class="dcol__count" id="delcount-Accepted">0</span>
        </header>
        <div class="dcol__list" id="dellist-Accepted"></div>
      </section>

      <section class="dcol" data-dstatus="Preparing">
        <header class="dcol__head ds-Preparing">
          <svg class="icon"><use href="#i-flame"/></svg><h2 data-i18n="col.Preparing">Preparing</h2>
          <span class="dcol__count" id="delcount-Preparing">0</span>
        </header>
        <div class="dcol__list" id="dellist-Preparing"></div>
      </section>

      <section class="dcol" data-dstatus="Ready">
        <header class="dcol__head ds-Ready">
          <svg class="icon"><use href="#i-checkc"/></svg><h2 data-i18n="col.Ready">Ready</h2>
          <span class="dcol__count" id="delcount-Ready">0</span>
        </header>
        <div class="dcol__list" id="dellist-Ready"></div>
      </section>

      <section class="dcol" data-dstatus="Out for Delivery">
        <header class="dcol__head ds-Out">
          <svg class="icon"><use href="#i-scooter"/></svg><h2 data-i18n="col.Out for Delivery">On the way</h2>
          <span class="dcol__count" id="delcount-Out for Delivery">0</span>
        </header>
        <div class="dcol__list" id="dellist-Out for Delivery"></div>
      </section>

      <section class="dcol" data-dstatus="Finished">
        <header class="dcol__head ds-Done">
          <svg class="icon"><use href="#i-checks"/></svg><h2 data-i18n="col.Finished">Done</h2>
          <span class="dcol__count" id="delcount-Finished">0</span>
        </header>
        <div class="dcol__list" id="dellist-Finished"></div>
      </section>

    </div>
  </main>

  <div class="wtoast" id="wtoast" role="status" aria-live="polite"></div>

  <noscript>
    <div style="position:fixed;inset:0;background:#09384c;color:#f3fafc;display:grid;place-items:center;z-index:9999;font-family:sans-serif;text-align:center;padding:2rem">
      The waiter dashboard needs JavaScript to run. 🌊
    </div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
